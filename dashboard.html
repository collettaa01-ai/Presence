<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presence - Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header">
    <h1>🍽️ Presence</h1>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="user-info" id="userName"></span>
      <button class="btn-logout" id="logoutBtn">Esci</button>
    </div>
  </div>

  <div class="container" style="margin-top:24px">
    <!-- Clock card -->
    <div class="card">
      <div class="current-time" id="currentTime"></div>
      <div id="timerSection"><p class="empty-state">Caricamento...</p></div>
    </div>

    <!-- History -->
    <div class="card">
      <div class="card-title">Le tue presenze</div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Entrata</th>
              <th>Uscita</th>
              <th>Ore</th>
              <th>Stato</th>
            </tr>
          </thead>
          <tbody id="presenceTable">
            <tr><td colspan="5" class="empty-state">Caricamento...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from './js/firebase-config.js';
    import {
      onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import {
      doc, getDoc, addDoc, updateDoc,
      collection, query, where, orderBy, onSnapshot, Timestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    let currentUser = null;
    let userData   = null;
    let timerInterval = null;

    // Live clock
    function updateClock() {
      document.getElementById('currentTime').textContent =
        new Date().toLocaleString('it-IT', {
          weekday: 'long', day: 'numeric', month: 'long',
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
    }
    updateClock();
    setInterval(updateClock, 1000);

    function fmtTime(ts) {
      if (!ts) return '—';
      return ts.toDate().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
    }

    function fmtDate(s) {
      const [y, m, d] = s.split('-');
      return `${d}/${m}/${y}`;
    }

    function calcDuration(entrata, uscita) {
      if (!entrata || !uscita) return '—';
      const ms = uscita.toDate() - entrata.toDate();
      const h  = Math.floor(ms / 3600000);
      const m  = Math.floor((ms % 3600000) / 60000);
      return `${h}h ${m}m`;
    }

    function todayStr() {
      const n = new Date();
      return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
    }

    function startTimer(from) {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const ms = Date.now() - from.getTime();
        const h  = String(Math.floor(ms / 3600000)).padStart(2, '0');
        const m  = String(Math.floor((ms % 3600000) / 60000)).padStart(2, '0');
        const s  = String(Math.floor((ms % 60000) / 1000)).padStart(2, '0');
        const el = document.getElementById('liveTimer');
        if (el) el.textContent = `${h}:${m}:${s}`;
      }, 1000);
    }

    function renderTimerSection(shift) {
      const el = document.getElementById('timerSection');
      clearInterval(timerInterval);

      if (!shift) {
        el.innerHTML = `
          <div class="status-bar">
            <div class="status-dot"></div>
            <span class="status-text">Non in servizio</span>
          </div>
          <button class="btn-entrata" id="actionBtn">▶&nbsp; Segna Entrata</button>`;
        document.getElementById('actionBtn').addEventListener('click', handleEntrata);

      } else if (!shift.oraUscita) {
        el.innerHTML = `
          <div class="status-bar">
            <div class="status-dot attivo"></div>
            <span class="status-text">In servizio dalle <strong>${fmtTime(shift.oraEntrata)}</strong></span>
          </div>
          <div class="timer" id="liveTimer">00:00:00</div>
          <button class="btn-uscita" id="actionBtn">■&nbsp; Segna Uscita</button>`;
        document.getElementById('actionBtn').addEventListener('click', () => handleUscita(shift.id));
        startTimer(shift.oraEntrata.toDate());

      } else {
        el.innerHTML = `
          <div class="status-bar">
            <div class="status-dot"></div>
            <span class="status-text">Turno completato</span>
          </div>
          <div class="shift-summary">
            ${fmtTime(shift.oraEntrata)} → ${fmtTime(shift.oraUscita)}
            &nbsp;|&nbsp; ${calcDuration(shift.oraEntrata, shift.oraUscita)}
          </div>
          <button class="btn-entrata" id="actionBtn">▶&nbsp; Nuovo Turno</button>`;
        document.getElementById('actionBtn').addEventListener('click', handleEntrata);
      }
    }

    async function handleEntrata() {
      const btn = document.getElementById('actionBtn');
      btn.disabled = true;
      try {
        await addDoc(collection(db, 'presenze'), {
          userId:     currentUser.uid,
          userName:   userData.nome,
          data:       todayStr(),
          oraEntrata: Timestamp.now(),
          oraUscita:  null,
        });
      } catch (err) {
        console.error(err);
        btn.disabled = false;
      }
    }

    async function handleUscita(shiftId) {
      const btn = document.getElementById('actionBtn');
      btn.disabled = true;
      try {
        await updateDoc(doc(db, 'presenze', shiftId), {
          oraUscita: Timestamp.now()
        });
      } catch (err) {
        console.error(err);
        btn.disabled = false;
      }
    }

    // Auth guard
    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'index.html'; return; }
      currentUser = user;

      const snap = await getDoc(doc(db, 'users', user.uid));
      if (!snap.exists()) { window.location.href = 'index.html'; return; }
      userData = snap.data();
      if (userData.ruolo === 'admin') { window.location.href = 'admin.html'; return; }

      document.getElementById('userName').textContent = userData.nome;

      // Today's most recent shift (for the clock-in/out button)
      const today = todayStr();
      onSnapshot(
        query(collection(db, 'presenze'),
          where('userId', '==', user.uid),
          where('data', '==', today),
          orderBy('oraEntrata', 'desc')),
        (snap) => {
          const shifts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          renderTimerSection(shifts[0] ?? null);
        }
      );

      // Full history
      onSnapshot(
        query(collection(db, 'presenze'),
          where('userId', '==', user.uid),
          orderBy('oraEntrata', 'desc')),
        (snap) => {
          const tbody = document.getElementById('presenceTable');
          if (snap.empty) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Nessuna presenza registrata</td></tr>';
            return;
          }
          tbody.innerHTML = snap.docs.map(d => {
            const p = d.data();
            const ip = !p.oraUscita;
            return `<tr class="${ip ? 'in-progress' : ''}">
              <td>${fmtDate(p.data)}</td>
              <td>${fmtTime(p.oraEntrata)}</td>
              <td>${fmtTime(p.oraUscita)}</td>
              <td>${calcDuration(p.oraEntrata, p.oraUscita)}</td>
              <td><span class="badge ${ip ? 'badge-in' : 'badge-out'}">${ip ? '● In servizio' : 'Completato'}</span></td>
            </tr>`;
          }).join('');
        }
      );
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      clearInterval(timerInterval);
      await signOut(auth);
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
